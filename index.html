level-filters{display:flex;gap:5px}.filter-button{border:1px solid var(--line);background:var(--white);padding:9px 11px;border-radius:4px;font-size:11px;cursor:pointer}.filter-button.active{background:var(--ink);color:var(--white);border-color:var(--ink)}.table-panel{overflow:hidden}.table-meta{padding:13px 17px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.word-table{width:100%;border-collapse:collapse;text-align:left}.word-table th{padding:11px 16px;color:var(--muted);background:#f8faf6;font-size:10px;font-weight:600}.word-table td{padding:11px 16px;border-top:1px solid #edf0eb;font-size:12px}.word-table tr:hover td{background:#fbfcf9}.word-table td:first-child{font:600 14px Georgia,serif}.level-mark{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:700}.pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.pagination-actions{display:flex;gap:6px}.pagination button{min-height:30px;padding:0 10px;border:1px solid var(--line);background:var(--white);border-radius:4px;cursor:pointer}.pagination button:disabled{opacity:.4;cursor:default}.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:23px 0}.progress-panel{padding:20px}.progress-panel .stat-big{font-size:36px}.level-row{display:grid;grid-template-columns:68px 1fr 46px;gap:12px;align-items:center;margin:15px 0;font-size:12px}.level-row .meter{margin:0}.level-row .count{text-align:right;color:var(--muted);font-size:11px}.progress-footer{border-top:1px solid var(--line);margin-top:22px;padding-top:17px;display:flex;justify-content:space-between;align-items:center;gap:15px}.loading-state{min-height:55vh;display:grid;place-items:center}.loading-box{max-width:440px;background:var(--white);border:1px solid var(--line);padding:31px;border-radius:8px;box-shadow:var(--shadow)}.loading-box h1{font-size:27px}.loading-box p{color:var(--muted);font-size:13px;line-height:1.8}.loading-box a{color:var(--green)}.error-text{color:#9b3929!important}.file-input{display:none}.source-line{color:var(--muted);font-size:10px;margin-top:18px;line-height:1.7;overflow-wrap:anywhere}.toast{position:fixed;bottom:20px;right:22px;background:var(--ink);color:white;padding:12px 16px;border-radius:5px;font-size:12px;box-shadow:var(--shadow);z-index:5}

<body><div id="app"></div>
<script>
(() => {
  const DATA_URL="https://taisukef.github.io/globish/globishwords.csv", DATA_KEY="globish1500.words.v1", STATE_KEY="globish1500.progress.v1", PAGE_SIZE=50;
  const extras=[{en:"hello",ja:"こんにちは",level:1},{en:"goodbye",ja:"さようなら",level:1},{en:"airport",ja:"空港",level:1},{en:"internet",ja:"インターネット",level:1}];
  const app=document.getElementById("app"); let words=[],session=null,state=loadState(),toastTimer;
  function loadState(){try{const s=JSON.parse(localStorage.getItem(STATE_KEY)||"{}"),includeUnknown=Boolean(s.includeUnknown),levels=Array.isArray(s.levels)?s.levels.map(Number).filter(l=>[1,2,3,4].includes(l)):[1,2,3,4];return{progress:s.progress||{},goal:s.goal||15,daily:s.daily||{},shuffle:Boolean(s.shuffle),levels:levels.length||includeUnknown?levels:[1,2,3,4],includeUnknown}}catch(_){return{progress:{},goal:15,daily:{},shuffle:false,levels:[1,2,3,4],includeUnknown:false}}}
  function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state))}
  function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===","){row.push(field);field=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(field);field="";if(row.some(v=>v.trim()))rows.push(row);row=[]}else field+=c}if(field||row.length){row.push(field);if(row.some(v=>v.trim()))rows.push(row)}const header=(rows.shift()||[]).map(v=>v.trim().toLowerCase()),ei=header.indexOf("en"),ji=header.indexOf("ja"),li=header.indexOf("level");if(ei<0||ji<0||li<0)throw Error("CSVの列名を確認できません。");const seen=new Set(),list=[];for(const cells of rows){const item={en:(cells[ei]||"").trim(),ja:(cells[ji]||"").trim(),level:Number(cells[li])},key=item.en.toLowerCase();if(!item.en||!item.ja||!Number.isFinite(item.level)||seen.has(key))continue;seen.add(key);list.push(item)}for(const item of extras){if(list.length>=1500)break;if(!seen.has(item.en)){seen.add(item.en);list.push(item)}}return list.sort((a,b)=>a.level-b.level||a.en.localeCompare(b.en))}
  function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
  function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function todayCount(){return Number(state.daily[todayKey()]||0)}
  function record(word){return state.progress[word.en.toLowerCase()]||{stage:0,due:0}}
  function countStage(n){return words.filter(w=>record(w).stage>=n||(n===1&&record(w).unknown)).length}
  function dueCount(){const now=Date.now();return words.filter(w=>(state.levels.includes(w.level)||state.includeUnknown&&record(w).unknown)&&(state.includeUnknown&&record(w).unknown||((record(w).stage>0||record(w).unknown)&&record(w).due<=now))).length}
  function shuffleWords(list){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
  function getQueue(){const now=Date.now(),eligible=words.filter(w=>state.levels.includes(w.level)||state.includeUnknown&&record(w).unknown),due=eligible.filter(w=>{const p=record(w);return state.includeUnknown&&p.unknown||(p.stage>0||p.unknown)&&p.due<=now}).sort((a,b)=>record(a).due-record(b).due),retry=eligible.filter(w=>{const p=record(w);return p.stage===0&&!p.unknown&&p.due>0&&p.due<=now}),fresh=eligible.filter(w=>{const p=record(w);return p.stage===0&&!p.unknown&&!p.due});const queue=[...due,...retry,...fresh].slice(0,state.goal);return state.shuffle?shuffleWords(queue):queue}
  function renderLoading(title,message,failed=false){app.innerHTML='<main><div class="loading-state"><section class="loading-box"><div class="eyebrow">GLOBISH 1500</div><h1>'+escapeHTML(title)+'</h1><p class="'+(failed?'error-text':'')+'">'+escapeHTML(message).replaceAll("\n","<br>")+'</p>'+(failed?'<button class="button button-primary" data-action="retry">もう一度取得</button> <button class="button button-light" data-action="choose-csv">CSVを選ぶ</button><input class="file-input" id="csv-file" type="file" accept=".csv,text/csv">':"")+'<div class="source-line">語彙データ出典: <a href="https://github.com/taisukef/globish" target="_blank" rel="noreferrer">taisukef/globish</a></div></section></div></main>'}
  async function refreshData(){try{const res=await fetch(DATA_URL,{cache:"no-cache"});if(!res.ok)throw Error("語彙データを取得できませんでした ("+res.status+")");const parsed=parseCSV(await res.text());if(parsed.length<1500)throw Error("語彙データの件数を確認できません。");words=parsed;localStorage.setItem(DATA_KEY,JSON.stringify(words));render()}catch(err){if(!words.length)renderLoading("単語データを読み込めません",err.message+"\n\nネット接続を確認して再試行するか、CSVをダウンロードして選択してください。",true)}}
  function loadWords(){try{const cached=JSON.parse(localStorage.getItem(DATA_KEY)||"null");if(Array.isArray(cached)&&cached.length>=1500){words=cached;render();refreshData();return}}catch(_){}renderLoading("単語データを読み込んでいます","初回のみインターネット接続が必要です。Globishの英単語と日本語訳を取得しています。");refreshData()}
  function render(){if(!words.length)return;const page=state.page==="words"?"words":"study";app.innerHTML='<div class="shell"><aside><div class="brand"><div class="brand-mark">G</div><div><div class="brand-name">Word Garden</div><div class="brand-caption">GLOBISH 1500</div></div></div><div><p class="nav-label">YOUR DESK</p><nav class="nav"><button data-action="page" data-page="study" class="'+(page==="study"?"active":"")+'"><span class="nav-icon">✳</span>学習する</button><button data-action="page" data-page="words" class="'+(page==="words"?"active":"")+'"><span class="nav-icon">≡</span>単語一覧</button></nav></div><div class="aside-note"><strong>小さく続ける。</strong>毎日の復習は、このブラウザーに自動保存されます。</div></aside><main><div class="topline"><div class="topline-label">英語を、世界とつながる道具に。</div><div class="topline-stats"><span class="top-stat"><strong>'+todayCount()+'</strong>今日</span><span class="top-stat"><strong>'+countStage(3)+'</strong>定着</span></div></div><div class="content">'+(page==="study"?renderStudy():renderWords())+'</div></main></div>'}
  function heading(code,title,desc,tag=""){return'<div class="page-head"><div><div class="eyebrow">'+code+'</div><h1>'+title+'</h1><p class="intro">'+desc+'</p></div>'+(tag?'<div class="source-tag">'+tag+'</div>':"")+'</div>'}
  function goalPanel(){return'<section class="side-panel"><h2 class="side-title">今日の目標</h2><div class="goal-row"><div class="goal-value">'+state.goal+' <small>語 / 日</small></div><div class="stepper"><button aria-label="目標を減らす" data-action="goal" data-delta="-5">−</button><button aria-label="目標を増やす" data-action="goal" data-delta="5">+</button></div></div><div class="meter"><div class="meter-fill" style="width:'+Math.min(100,todayCount()/state.goal*100)+'%"></div></div><div class="small-copy">今日 '+todayCount()+' 語 / '+state.goal+' 語</div></section>'}
  function todayPanel(){const learned=countStage(1);return'<section class="side-panel"><h2 class="side-title">これまでの学習</h2><div class="stat-big">'+learned+'<small> / '+words.length+'語</small></div><div class="small-copy">学習を始めた単語</div><div class="meter"><div class="meter-fill" style="width:'+learned/words.length*100+'%;background:var(--green)"></div></div></section>'}
  function renderStudy(){const head=heading("DAILY PRACTICE / 01","今日の単語を、ひとつずつ。","思い出す練習を重ねて、使える語彙にしていきましょう。",'出典 <a href="https://github.com/taisukef/globish" target="_blank" rel="noreferrer">Globish 1500単語 CSV</a><br>英語・日本語訳・レベル');if(session&&session.finished)return head+'<section class="study-panel session-done"><div class="done-mark">✓</div><h2>今日のセッション完了</h2><p>'+session.completed+'回、単語を確認しました。</p><button class="button button-primary" data-action="page" data-page="progress">学習記録を見る</button> <button class="button button-light" data-action="new-session">続けて学習</button></section>';if(!session)return head+'<div class="study-layout"><section class="study-panel"><div class="study-top"><div class="study-top-label">今日のセッション</div><div class="study-count">'+dueCount()+' <span>語が復習どき</span></div></div><div class="card-body"><span class="card-level">LEVEL 1–4</span><div class="word">準備はできましたか？</div><div class="word-hint">英単語を見て、日本語の意味を思い出します。</div></div><div class="card-actions"><button class="button button-primary" data-action="start">学習をはじめる　→</button></div></section><div class="side-column">'+goalPanel()+todayPanel()+'</div></div><p class="source-line">初回取得後、語彙と進捗はこのブラウザーに保存されます。</p>';const item=session.queue[session.index];if(!item){session.finished=true;return renderStudy()}return head+'<div class="study-layout"><section class="study-panel"><div class="study-top"><div class="study-top-label">'+(session.revealed?'答え合わせ':'英語から意味を思い出す')+'</div><div class="study-count">'+(session.index+1)+' <span>/ '+session.queue.length+'語</span></div></div><div class="card-body"><span class="card-level">LEVEL '+item.level+'</span><div class="word">'+escapeHTML(item.en.toLowerCase())+'</div><div class="word-hint">日本語の意味を思い出したら、答えを確認。</div>'+(session.revealed?'<div class="answer">'+escapeHTML(item.ja)+'</div><div class="answer-note">意味を確認して、記憶の状態を選んでください。</div>':"")+'</div><div class="card-actions">'+(session.revealed?'<button class="button button-coral" data-action="rate" data-rating="again">もう一度</button><button class="button button-primary" data-action="rate" data-rating="known">覚えた</button>':'<button class="button button-primary" data-action="reveal">答えを見る　↓</button>')+'</div></section><div class="side-column">'+goalPanel()+todayPanel()+'</div></div>'}
  function filtered(){const q=(state.search||"").trim().toLowerCase();return words.filter(w=>(state.levelFilter==="unknown"?record(w).unknown:!state.levelFilter||state.levelFilter==="all"||w.level===Number(state.levelFilter))&&(!q||w.en.toLowerCase().includes(q)||w.ja.toLowerCase().includes(q)))}
  function table(rows){const pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));state.wordPage=Math.min(state.wordPage||0,pages-1);const start=state.wordPage*PAGE_SIZE,shown=rows.slice(start,start+PAGE_SIZE).map(w=>'<tr><td>'+escapeHTML(w.en.toLowerCase())+'</td><td>'+escapeHTML(w.ja)+'</td><td><span class="level-mark">'+w.level+'</span></td></tr>').join("");return'<div class="table-meta">'+rows.length+'語中 '+(rows.length?start+1:0)+'–'+Math.min(start+PAGE_SIZE,rows.length)+'語</div><table class="word-table"><thead><tr><th>ENGLISH</th><th>日本語</th><th>LEVEL</th></tr></thead><tbody>'+(shown||'<tr><td colspan="3">一致する単語はありません。</td></tr>')+'</tbody></table><div class="pagination"><span>ページ '+(state.wordPage+1)+' / '+pages+'</span><div class="pagination-actions"><button data-action="word-page" data-delta="-1" '+(state.wordPage<=0?'disabled':'')+'>← 前へ</button><button data-action="word-page" data-delta="1" '+(state.wordPage>=pages-1?'disabled':'')+'>次へ →</button></div></div>'}
  function renderWords(){return heading("WORD INDEX / 02","単語を探す。","レベル別に並んだGlobishの語彙を検索できます。","収録 "+words.length+" 語")+'<div class="list-controls"><label class="search-wrap"><span class="search-icon">⌕</span><input id="word-search" type="search" placeholder="英単語・日本語で検索" value="'+escapeHTML(state.search||"")+'"></label><div class="level-filters">'+["all",1,2,3,4,"unknown"].map(l=>'<button class="filter-button '+(String(state.levelFilter||"all")===String(l)?"active":"")+'" data-action="filter" data-level="'+l+'">'+(l==="unknown"?"復習リスト ("+words.filter(w=>record(w).unknown).length+")":l==="all"?"すべて":"Lv."+l)+'</button>').join("")+'</div></div><section class="table-panel" id="word-results">'+table(filtered())+'</section>'}
  function renderProgress(){const started=countStage(1),steady=countStage(3),levels=[1,2,3,4].map(l=>{const all=words.filter(w=>w.level===l).length,master=words.filter(w=>w.level===l&&record(w).stage>=3).length,color=["","var(--green)","var(--blue)","var(--coral)","var(--yellow)"][l];return'<div class="level-row"><strong>LEVEL '+l+'</strong><div class="meter"><div class="meter-fill" style="width:'+(all?master/all*100:0)+'%;background:'+color+'"></div></div><span class="count">'+master+' / '+all+'</span></div>'}).join("");return heading("YOUR PROGRESS / 03","続けた分だけ、力になる。","復習間隔を少しずつ広げて、長く覚えておけるようにします。")+'<div class="progress-grid"><section class="progress-panel"><div class="eyebrow">STARTED</div><div class="stat-big">'+started+'<small> / '+words.length+'</small></div><div class="small-copy">学習を始めた単語</div></section><section class="progress-panel"><div class="eyebrow">IN MEMORY</div><div class="stat-big">'+steady+'<small> / '+words.length+'</small></div><div class="small-copy">復習が進んでいる単語</div></section><section class="progress-panel"><div class="eyebrow">REVIEWED TODAY</div><div class="stat-big">'+todayCount()+'<small> 語</small></div><div class="small-copy">今日の復習数</div></section></div><section class="progress-panel"><h2 class="side-title">レベル別の定着状況</h2>'+levels+'<div class="progress-footer"><div class="small-copy">同じ単語を繰り返し確認すると、次の復習までの間隔が広がります。</div><button class="button button-light" data-action="reset">学習記録をリセット</button></div></section><p class="source-line">データはこのブラウザー内に保存されます。サイトデータを削除すると進捗も消去されます。</p>'}
  function startSession(){const queue=getQueue();if(!queue.length){notify("今日復習できる単語はありません。");return}session={queue,index:0,revealed:false,completed:0};state.page="study";render()}
  function rate(rating){const word=session.queue[session.index],key=word.en.toLowerCase(),old=record(word),known=rating==="known",stage=known?Math.min(5,old.stage+1):0,days=[1,3,7,14,30];state.progress[key]={stage,due:Date.now()+(known?days[Math.max(0,stage-1)]*86400000:600000),unknown:!known};state.daily[todayKey()]=todayCount()+1;session.completed++;session.index++;session.revealed=false;if(session.index>=session.queue.length)session.finished=true;saveState();render()}
  function notify(text){document.querySelector(".toast")?.remove();const el=document.createElement("div");el.className="toast";el.textContent=text;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2500)}
  function updateTable(){const target=document.getElementById("word-results");if(target)target.innerHTML=table(filtered())}
  app.addEventListener("input",e=>{if(e.target.id==="word-search"){state.search=e.target.value;state.wordPage=0;updateTable()}});
  app.addEventListener("change",async e=>{if(e.target.id==="shuffle-toggle"){state.shuffle=e.target.checked;saveState();return}if(e.target.matches("input[data-level-choice],#unknown-choice")){const selected=[...app.querySelectorAll("input[data-level-choice]:checked")].map(input=>Number(input.dataset.levelChoice)),includeUnknown=app.querySelector("#unknown-choice").checked;if(!selected.length&&!includeUnknown){e.target.checked=true;notify("レベルか復習リストを1つ以上選んでください。");return}state.levels=selected.sort((a,b)=>a-b);state.includeUnknown=includeUnknown;saveState();render();return}if(e.target.id!=="csv-file"||!e.target.files[0])return;try{const parsed=parseCSV(await e.target.files[0].text());if(parsed.length<1500)throw Error("1500語のCSVを選択してください。");words=parsed;localStorage.setItem(DATA_KEY,JSON.stringify(words));render()}catch(err){renderLoading("CSVを読み込めません",err.message,true)}});
  app.addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(!b)return;const a=b.dataset.action;if(a==="page"){state.page=b.dataset.page;session=null;render()}else if(a==="start"||a==="new-session")startSession();else if(a==="reveal"){session.revealed=true;render()}else if(a==="rate")rate(b.dataset.rating);else if(a==="goal"){state.goal=Math.max(5,Math.min(50,state.goal+Number(b.dataset.delta)));saveState();render()}else if(a==="filter"){state.levelFilter=b.dataset.level;state.wordPage=0;render()}else if(a==="word-page"){state.wordPage=Math.max(0,(state.wordPage||0)+Number(b.dataset.delta));updateTable()}else if(a==="reset"){if(confirm("学習記録をすべて削除します。この操作は元に戻せません。")){state.progress={};state.daily={};saveState();render()}}else if(a==="retry")loadWords();else if(a==="choose-csv")document.getElementById("csv-file")?.click()});
  function renderPrepSummary(){const started=countStage(1),steady=countStage(3),levels=[1,2,3,4].map(level=>{const total=words.filter(word=>word.level===level).length,mastered=words.filter(word=>word.level===level&&record(word).stage>=3).length,color=["","var(--green)","var(--blue)","var(--coral)","var(--yellow)"][level];return'<div class="prep-level-row"><strong>LEVEL '+level+'</strong><div class="meter"><div class="meter-fill" style="width:'+(total?mastered/total*100:0)+'%;background:'+color+'"></div></div><span class="prep-level-count">'+mastered+' / '+total+' 定着</span></div>'}).join("");return'<h2 class="prep-summary-title">学習記録</h2><div class="prep-metrics"><div class="prep-metric"><div class="prep-metric-label">学習を始めた単語</div><div class="prep-metric-value">'+started+'<small> / '+words.length+'</small></div></div><div class="prep-metric"><div class="prep-metric-label">定着した単語</div><div class="prep-metric-value">'+steady+'<small> / '+words.length+'</small></div></div><div class="prep-metric"><div class="prep-metric-label">今日の復習数</div><div class="prep-metric-value">'+todayCount()+'<small> 語</small></div></div></div><div class="prep-levels">'+levels+'</div>'}
  function syncStudyControls(){const known=app.querySelector('button[data-action="rate"][data-rating="known"]'),unknown=app.querySelector('button[data-action="rate"][data-rating="again"]');if(known&&known.textContent!=="覚えた！")known.textContent="覚えた！";if(unknown&&unknown.textContent!=="復習リストに追加")unknown.textContent="復習リストに追加";const panel=app.querySelector(".study-panel"),start=app.querySelector('button[data-action="start"]'),actions=panel?.querySelector(".card-actions");if(start&&panel){const body=panel.querySelector(".card-body");if(body&&!body.querySelector(".prep-summary-title")){body.classList.add("prep-summary-body");body.innerHTML=renderPrepSummary()}if(actions&&!panel.querySelector("#study-options")){const options=document.createElement("div");options.id="study-options";options.className="study-options";options.innerHTML='<div class="study-options-head"><span class="study-options-title">今回の学習設定</span><label class="shuffle-option"><input id="shuffle-toggle" type="checkbox"> シャッフルして出題</label></div><div class="level-options"><span class="level-options-label">学習するレベル</span>'+[1,2,3,4].map(level=>'<label class="level-option"><input type="checkbox" data-level-choice="'+level+'"> レベル '+level+'</label>').join("")+'</div>';options.querySelector("#shuffle-toggle").checked=state.shuffle;options.querySelectorAll("input[data-level-choice]").forEach(input=>input.checked=state.levels.includes(Number(input.dataset.levelChoice)));actions.before(options);const source=panel.querySelector(".source-line");if(source)source.classList.add("prep-source")}}}
  function ensureUnknownChoice(){const options=app.querySelector(".level-options");if(!options||options.querySelector("#unknown-choice"))return;const label=document.createElement("label");label.className="level-option";label.innerHTML='<input id="unknown-choice" type="checkbox"> 復習リスト';label.querySelector("input").checked=state.includeUnknown;options.appendChild(label)}
  function makeStudyCardClickable(){const card=app.querySelector(".study-layout .study-panel");if(!card)return;const hint=card.querySelector(".word-hint"),reveal=card.querySelector('button[data-action="reveal"]'),known=card.querySelector('button[data-action="rate"][data-rating="known"]'),guide=card.querySelector(".answer-note"),actions=card.querySelector(".card-actions");if(reveal){if(hint&&hint.textContent!=="クリックで意味（日本語）を表示")hint.textContent="クリックで意味（日本語）を表示";reveal.remove();if(actions&&!actions.querySelector("button"))actions.remove();card.dataset.action="reveal-card";card.tabIndex=0;card.setAttribute("role","button");card.setAttribute("aria-label","クリックで意味（日本語）を表示");return}if(!session?.revealed)return;hint?.remove();known?.remove();if(guide&&guide.textContent!=="クリックで次の単語に進む")guide.textContent="クリックで次の単語に進む";card.dataset.action="advance-card";card.tabIndex=0;card.setAttribute("role","group");card.setAttribute("aria-label","クリックで次の単語に進む")}
  function removeProgressLinks(){app.querySelector('nav [data-page="progress"]')?.remove();app.querySelector('.session-done [data-page="progress"]')?.remove()}
  new MutationObserver(()=>{removeProgressLinks();syncStudyControls();ensureUnknownChoice();makeStudyCardClickable()}).observe(app,{childList:true,subtree:true});
  removeProgressLinks();
  syncStudyControls();
  app.addEventListener("click",e=>{const card=e.target.closest('.study-panel[data-action="reveal-card"],.study-panel[data-action="advance-card"]');if(!card||e.target.closest("button")||!session||session.finished)return;if(session.revealed)rate("known");else{session.revealed=true;render()}});
  document.addEventListener("keydown",e=>{if((e.code!=="Enter"&&e.code!=="Space")||!session||session.finished||!e.target.matches('.study-panel[data-action="reveal-card"],.study-panel[data-action="advance-card"]'))return;e.preventDefault();if(session.revealed)rate("known");else{session.revealed=true;render()}});
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("./sw.js").catch(error=>console.warn("Service Worker registration failed",error))}
  loadWords();
})();
</script></body></html>
